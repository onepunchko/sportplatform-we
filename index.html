<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学生运动健康小程序原型</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            padding: 2rem;
        }
        .prototype-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            border: 10px solid #111;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .page-title {
            margin-top: 1rem;
            font-weight: 600;
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container mx-auto py-5">
        <h1 class="text-3xl font-bold mb-10 text-center">大学生运动健康小程序原型</h1>
        
        <div class="prototype-container">
            <!-- 首页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/home.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">首页</h2>
            </div>
            
            <!-- 运动追踪页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/tracking.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">运动追踪</h2>
            </div>
            
            <!-- 场地预约页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/reservation.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">场地预约</h2>
            </div>
            
            <!-- 社区页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/community.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">运动社区</h2>
            </div>
            
            <!-- 个人资料页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/profile.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">个人资料</h2>
            </div>
            
            <!-- AI教练页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/ai-coach.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">AI教练</h2>
            </div>
            
            <!-- 运动挑战页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/challenge.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">运动挑战</h2>
            </div>
            
            <!-- 资讯页 -->
            <div class="prototype-item">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <iframe src="pages/news.html" frameborder="0" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <h2 class="page-title">运动资讯</h2>
            </div>
        </div>
    </div>
</body>
</html>
