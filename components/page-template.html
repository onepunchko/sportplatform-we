<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面标题</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }
        
        .page-content {
            padding: 15px;
            padding-top: 60px;
            padding-bottom: 70px;
        }
    </style>
</head>
<body>
    <!-- 引入顶部状态栏 -->
    <div id="status-bar"></div>
    
    <!-- 页面内容 -->
    <div class="page-content">
        <!-- 此处为页面主要内容 -->
    </div>
    
    <!-- 引入底部导航栏 -->
    <div id="tab-bar"></div>
    
    <script>
        // 加载共用组件
        fetch('../components/common.html')
            .then(response => response.text())
            .then(data => {
                // 插入顶部状态栏和底部导航栏
                const parser = new DOMParser();
                const htmlDoc = parser.parseFromString(data, 'text/html');
                
                // 获取状态栏
                const statusBar = htmlDoc.querySelector('.ios-status-bar');
                document.getElementById('status-bar').appendChild(statusBar);
                
                // 获取底部导航栏
                const tabBar = htmlDoc.querySelector('.tab-bar');
                document.getElementById('tab-bar').appendChild(tabBar);
                
                // 设置当前页面的导航项为激活状态
                const pageName = window.location.pathname.split('/').pop();
                const currentTab = document.querySelector(`.tab-item[href="${pageName}"]`);
                if (currentTab) {
                    currentTab.classList.add('active');
                }
            });
    </script>
</body>
</html>
